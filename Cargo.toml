[workspace]
resolver = "2"
members = [
    "crates/sihora",
    "crates/sihora-derive",
    "examples/shapes",
    "examples/text",
    "examples/counter",
    "examples/todo",
    "examples/gallery",
    "examples/todo-db",
    "examples/todo-mobile",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sihora/sihora"
rust-version = "1.97"

[workspace.dependencies]
sihora-derive = { path = "crates/sihora-derive", version = "0.1.0" }
cosmic-text = "0.12"
slotmap = "1"
wgpu = "24"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
accesskit = "0.16"
accesskit_winit = "0.22"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"
console_error_panic_hook = "0.1"
