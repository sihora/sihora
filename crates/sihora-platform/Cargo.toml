[package]
name = "sihora-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Platform shells (desktop, web, mobile) for Sihora"

[features]
default = []
android = ["winit/android-native-activity"]

[dependencies]
sihora-core.workspace = true
sihora-render.workspace = true
sihora-text.workspace = true
winit.workspace = true
wgpu.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
accesskit.workspace = true
accesskit_winit.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "Window", "Document", "Element", "HtmlCanvasElement",
    "CanvasRenderingContext2d", "CssStyleDeclaration",
    "ImageData", "TextMetrics", "Performance",
] }
console_error_panic_hook.workspace = true
