[package]
name = "sihora"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Declarative cross-platform UI framework in pure Rust"

[features]
default = ["full"]
full = ["render", "text", "widgets", "primitives", "platform", "data"]
render = ["dep:wgpu", "dep:bytemuck"]
text = ["dep:cosmic-text"]
widgets = ["render", "text"]
primitives = []
platform = ["render", "text", "dep:winit", "dep:pollster", "dep:accesskit", "dep:accesskit_winit", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:console_error_panic_hook"]
data = ["dep:sihora-derive", "dep:rusqlite"]
android = ["platform", "winit/android-native-activity"]

[dependencies]
slotmap.workspace = true

# render
wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }

# text
cosmic-text = { workspace = true, optional = true }

# platform
winit = { workspace = true, optional = true }

# data
sihora-derive = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true, optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
accesskit = { workspace = true, optional = true }
accesskit_winit = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Window", "Document", "Element", "HtmlCanvasElement",
    "CanvasRenderingContext2d", "CssStyleDeclaration",
    "ImageData", "TextMetrics", "Performance",
] }
console_error_panic_hook = { workspace = true, optional = true }
